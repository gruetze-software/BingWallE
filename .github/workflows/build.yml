name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to rebuild and publish (leave empty for a test build)'
        required: false
        type: string
        default: ''
      sign_macos:
        description: 'Test Apple signing and notarization without publishing (requires Apple secrets)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.platform == 'macos' && 90 || 25 }}
    env:
      MACOS_SIGN_REQUESTED: ${{ matrix.platform == 'macos' && github.event_name != 'pull_request' && ((github.event_name == 'workflow_dispatch' && inputs.sign_macos) || (vars.MACOS_SIGNING_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            rid: linux-x64
            platform: linux
            arch: x64
          - os: macos-26
            rid: osx-arm64
            platform: macos
            arch: arm64
          - os: macos-26-intel
            rid: osx-x64
            platform: macos
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(dotnet msbuild BingWallE/BingWallE.csproj -nologo -getProperty:Version)
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/RELEASE-$version.md"
      - name: Restore
        run: dotnet restore BingWallE.sln
      - name: Build
        run: dotnet build BingWallE.sln -c Release --no-restore --warnaserror
      - name: Test
        env:
          BINGWALLE_TEST_MODEL: '1'
        run: dotnet test BingWallE.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Recognition shutdown smoke test
        shell: bash
        run: |
          dotnet build tools/RecognitionSmoke/RecognitionSmoke.csproj -c Release --warnaserror
          for attempt in 1 2 3; do
            ORT_DISABLE_TELEMETRY=0 dotnet tools/RecognitionSmoke/bin/Release/net10.0/RecognitionSmoke.dll artifacts/shutdown-test-model
          done
      - name: Version smoke test
        shell: bash
        run: |
          version=$(dotnet msbuild BingWallE/BingWallE.csproj -nologo -getProperty:Version)
          test "$(dotnet BingWallE/bin/Release/net10.0/bingwalle.dll --version)" = "BingWallE ${version}"
      - name: Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Architecture '${{ matrix.arch }}'
      - name: Linux package
        if: matrix.platform == 'linux'
        run: bash scripts/build-linux.sh '${{ matrix.arch }}'
      - name: Framework-dependent Linux install check
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-nuget-feed"
          prefix="$RUNNER_TEMP/bingwalle-flatpak-stage"
          # The preceding publish populated the cache. Restore with no remote feed.
          bash scripts/install-flatpak.sh --prefix "$prefix" --nuget-source "$RUNNER_TEMP/empty-nuget-feed"
          version=$(dotnet msbuild BingWallE/BingWallE.csproj -nologo -getProperty:Version)
          test "$("$prefix/bin/bingwalle" --version)" = "BingWallE $version"
          # A portable publish silently bundles native assets for all platforms.
          test ! -d "$prefix/bin/runtimes"
          test -s "$prefix/bin/libonnxruntime.so"
          test -s "$prefix/bin/libSkiaSharp.so"
          test -s "$prefix/bin/libHarfBuzzSharp.so"
          test ! -e "$prefix/bin/onnxruntime.dll"
          test -z "$(find "$prefix/bin" -type f \( -name '*.pdb' -o -name '*.dylib' -o -name '*.aar' -o -name '*.xcframework.zip' \) -print -quit)"
          app_id=de.gruetze_software.BingWallE
          for file in "share/applications/$app_id.desktop" "share/icons/hicolor/256x256/apps/$app_id.png" "share/metainfo/$app_id.metainfo.xml" "share/licenses/$app_id/LICENSE"; do
            test -s "$prefix/$file"
          done
          diff -r licenses "$prefix/share/licenses/$app_id/third-party"
      - name: macOS package
        if: matrix.platform == 'macos' && env.MACOS_SIGN_REQUESTED != 'true'
        run: bash scripts/build-macos.sh '${{ matrix.arch }}'
      - name: Test macOS signing control flow
        if: matrix.platform == 'macos'
        run: python3 scripts/test-macos-signing.py
      - name: Sign and notarize macOS package
        if: matrix.platform == 'macos' && env.MACOS_SIGN_REQUESTED == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/build-macos-signed.sh '${{ matrix.arch }}'
      - name: Check release package contents
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            windows) python scripts/check-release-files.py windows artifacts/BingWallE-*-win-*.zip ;;
            macos) python3 scripts/check-release-files.py macos artifacts/BingWallE-*-macos-*.zip ;;
            linux)
              python3 scripts/check-release-files.py linux artifacts/BingWallE-*-linux-*.tar.gz
              dpkg-deb -x artifacts/BingWallE-*-linux-*.deb "$RUNNER_TEMP/deb-content-check"
              python3 scripts/check-release-files.py linux "$RUNNER_TEMP/deb-content-check"
              ;;
          esac
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.rid }}
          path: TestResults/*.trx
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.rid }}
          path: |
            artifacts/BingWallE-*.zip
            artifacts/BingWallE-*.tar.gz
            artifacts/BingWallE-*.deb
            artifacts/BingWallE-*.dmg
          if-no-files-found: error

  linux-desktop:
    name: Native Wayland and X11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y weston xvfb libegl1 libgles2 libgl1-mesa-dri libwayland-egl1 libxkbcommon0
      - name: Test native Wayland, X11 and automatic fallback
        run: bash scripts/test-linux-backends.sh
      - name: Upload Linux display logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-display-logs
          path: artifacts/linux-backends/*.log

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, linux-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/RELEASE-$version.md"
          expected=("win-x64.zip" "linux-x64.tar.gz" "linux-x64.deb" "macos-arm64.zip" "macos-arm64.dmg" "macos-x64.zip" "macos-x64.dmg")
          for package in "${expected[@]}"; do
            test -s "release-assets/BingWallE-$version-$package"
          done
          (cd release-assets && sha256sum BingWallE-* > SHA256SUMS.txt)
          notes="$RUNNER_TEMP/release-notes.md"
          cp "docs/RELEASE-$version.md" "$notes"
          printf '\n' >> "$notes"
          cat docs/RELEASE-STORES.md >> "$notes"
          if [[ "$MACOS_SIGNING_ENABLED" == true ]]; then
            printf '\nmacOS downloads are Developer ID signed and notarized by Apple.\n' >> "$notes"
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "BingWallE $version" --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --draft=false --latest
